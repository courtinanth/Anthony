# Configuration Netlify — anthony-courtin.com
#
# Les redirections vivent toutes dans _redirects (généré par
# scripts/build-redirects.js). Netlify évalue les règles de netlify.toml AVANT
# celles de _redirects : garder des 301 ici les ferait passer devant les
# redirections de slugs et créerait des chaînes. Ce fichier ne porte donc plus
# que les en-têtes.
#
# Les URL propres sans extension sont servies nativement par Netlify
# (un fichier /foo.html répond sur /foo) : aucune règle n'est nécessaire.

# Headers de sécurité et performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
