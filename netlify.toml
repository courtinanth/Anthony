# Configuration Netlify — anthony-courtin.com
#
# Les redirections vivent toutes dans _redirects (généré par
# scripts/build-redirects.js). Netlify évalue les règles de netlify.toml AVANT
# celles de _redirects : garder des 301 ici les ferait passer devant les
# redirections de slugs et créerait des chaînes. Ce fichier ne porte donc plus
# que les en-têtes.
#
# Les URL propres sans extension sont servies nativement par Netlify
# (un fichier /foo.html répond sur /foo) : aucune règle n'est nécessaire.

# ---------------------------------------------------------------------------
# Build
#
# Le site est statique : il n'y a rien à compiler, la racine du dépôt est
# publiée telle quelle. Mais dès qu'un package.json est présent, Netlify lance
# un npm install au déploiement. Or les dépendances de ce dépôt sont toutes
# des outils de développement : netlify-cli, Playwright, axe-core, lucide.
# Sans le garde-fou ci-dessous, chaque déploiement téléchargerait plusieurs
# centaines de Mo, dont un navigateur Chromium, pour ne rien en faire.
#
# NPM_FLAGS = "--omit=dev" saute les devDependencies. Comme il n'existe aucune
# dépendance de production, l'installation devient un no-op.
# ---------------------------------------------------------------------------
[build]
  # v2 : le site refondu vit dans /v2 (SEO + GEO + IA, charte vert sapin).
  # L'ancien site reste dans la racine du repo mais n'est plus publié.
  publish = "v2"
  command = "echo 'Site statique : aucun build nécessaire.'"

[build.environment]
  NPM_FLAGS = "--omit=dev"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# Headers de sécurité et performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

    # X-XSS-Protection a été retiré volontairement. L'en-tête est obsolète,
    # tous les navigateurs modernes l'ignorent, et son filtre historique
    # pouvait lui-même introduire des failles. La bonne protection est une CSP.
    # Voir la note sur la CSP en bas de fichier.

    # HSTS : force HTTPS pendant 2 ans, sous-domaines inclus.
    # preload n'est pas activé — c'est une inscription difficile à annuler,
    # à décider séparément.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"

    # Le site n'a besoin d'aucune de ces API : on les coupe toutes. Seules
    # exceptions, ouvertes à la seule origine du lecteur YouTube : autoplay,
    # encrypted-media, picture-in-picture et plein écran. Sans elles, la vidéo
    # d'un article se charge au clic mais refuse de démarrer.
    Permissions-Policy = "accelerometer=(), autoplay=(self \"https://www.youtube-nocookie.com\"), camera=(), display-capture=(), encrypted-media=(self \"https://www.youtube-nocookie.com\"), fullscreen=(self \"https://www.youtube-nocookie.com\"), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(self \"https://www.youtube-nocookie.com\"), usb=()"

    # Isole le contexte de navigation des fenêtres ouvertes par le site.
    Cross-Origin-Opener-Policy = "same-origin"

# CSS et JS : ces fichiers changent SANS changer de nom (main.css, site.js).
# "immutable 1 an" ferait garder aux navigateurs l'ancienne version un an
# apres chaque deploiement (HTML neuf + CSS vieux = site casse). On laisse
# l'ETag faire son travail : revalidation a chaque visite, 304 si inchange.
# En complement, les references portent un ?v=N a incrementer a chaque
# modification de CSS/JS pour forcer le rechargement des caches existants.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------------------------------------------------------------------------
# Content-Security-Policy : activée avec le site v2 (août 2026).
#
# Le site v2 n'a plus ni iframes Maps ni widget SociableKit. Tiers restants :
#   - fonts.googleapis.com (CSS des polices) et fonts.gstatic.com (fichiers)
#   - formsubmit.co (cible du formulaire de contact -> form-action)
#   - youtube-nocookie.com (frame-src) : le lecteur des articles de blog, inséré
#     seulement au clic sur la façade. La miniature de la façade reste servie
#     depuis /images ; i.ytimg.com n'est ouvert que pour l'affiche interne du
#     lecteur, que le navigateur évalue avec la CSP de la page parente.
# Les scripts sont tous auto-hébergés (aucun inline exécutable : le générateur
# S·M·T·F du blog a été externalisé dans /js/smtf-tool.js).
# 'unsafe-inline' reste nécessaire pour style-src : attributs style inline.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://i.ytimg.com; media-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com; form-action 'self' https://formsubmit.co; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
